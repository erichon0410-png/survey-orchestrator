services:
  browser-03:
    container_name: SurveyCompleter-gmail-03
    image: survey-orchestrator-chromium:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.chromium
    restart: unless-stopped
    ports:
      - "127.0.0.1:3013:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - TITLE=Gmail 03
      - START_DOCKER=true
      - PIXELFLUX_WAYLAND=true
    shm_size: '1gb'
    security_opt:
      - seccomp:unconfined
    volumes:
      - mpt-gmail-03-config:/config

