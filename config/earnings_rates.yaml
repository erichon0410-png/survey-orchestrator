# Authoritative point-to-USD conversion rates and account mappings.
# Used by: worker prompt (survey_agent_prompt.txt), earnings_ledger.mjs, build_earnings_graph.mjs
# Do NOT edit survey_config.yaml — it is owned by another task.

accounts:
  opinionoutpost:user01@example.com:
    platform: opinionoutpost
    email: user01@example.com
    ports: [3013]
    conversion: platform_displayed_usd  # read USD directly from platform; do NOT assume a fixed point rate
    notes: "OpinionOutpost shows a dollar balance directly. Read it as-is."

  swagbucks:user02@example.com:
    platform: swagbucks
    email: user02@example.com
    ports: [3014, 3017]  # shared account across two ports
    conversion: points_to_usd
    rate: 0.01  # 1 SB = $0.01, so 100 SB = $1.00
    unit: SB
    notes: "Shared account. Ports 3014 and 3017 feed the same logical balance."

  surveyjunkie:user04@example.com:
    platform: surveyjunkie
    email: user04@example.com
    ports: [3016]
    conversion: points_to_usd
    rate: 0.01  # 100 points = $1.00, so 1 point = $0.01
    unit: points
    notes: "SurveyJunkie shows points. 100 points = $1.00."

  primeopinion:user03@example.com:
    platform: primeopinion
    email: user03@example.com
    ports: [3015]
    conversion: platform_displayed_usd  # read displayed balance; default $0.00 until verified
    notes: "New platform (was ACOP). Read the displayed balance."

# Port-to-account lookup (derived from above; kept flat for driver speed)
port_map:
  3013: opinionoutpost:user01@example.com
  3014: swagbucks:user02@example.com
  3015: primeopinion:user03@example.com
  3016: surveyjunkie:user04@example.com
  3017: swagbucks:user02@example.com
