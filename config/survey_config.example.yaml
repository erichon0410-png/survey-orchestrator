execution:
  max_concurrent: 4
  timeout_seconds: 1800
  retry_attempts: 1
  prompt_template: prompts/survey_agent_prompt.txt
  output_dir: output
  log_dir: logs

platforms:
  swagbucks:
    url: https://www.swagbucks.com
    signup_email_domain: gmail.com
    notes: "Complete surveys for SB points. Record payout per survey."

  acop:
    url: https://www.acop.com
    notes: "American Consumer Opinion (Dynata). Login at /login/."

  opinionoutpost:
    url: https://www.opinionoutpost.com
    notes: "Dynata panel; Cognito auth."

  surveyjunkie:
    url: https://www.surveyjunkie.com
    notes: "Account created via Google-OAuth; password set via SJ create-password email flow."

  eureka:
    url: https://eurekasurveys.com/surveys
    notes: "Port 3015. Migrated from PrimeOpinion to Eureka on 2026-09-10; login erichong0410@gmail.com; displays USD balance directly."
