# Survey Orchestrator Configuration — TEMPLATE (example)
#
# This is the committed, secret-free template. The live config that the fleet
# actually reads is `config/survey_config.yaml` (gitignored; real credentials).
#
# To set up a new machine:
#   1. cp config/survey_config.example.yaml config/survey_config.yaml
#   2. Fill in each agent's account.email / password and set status to logged-in
#      once the persona has signed in on that container.
#
# Keep real credentials ONLY in config/survey_config.yaml (and optionally a
# gitignored .local copy). Never commit real emails or passwords.

agents:
  - name: agent-03
    container: SurveyCompleter-gmail-03
    port: 3013
    model: gpt-5.6-luna
    reasoning_effort: medium
    persona: personas/mei_lin_chen.yaml
    platforms: [opinionoutpost]
    account:
      email: "user03@example.com"
      password: "CHANGE_ME"
      status: not-logged-in

